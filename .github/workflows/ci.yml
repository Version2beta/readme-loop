name: Validate lightweight skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.x'
          - os: macos-latest
            python: '3.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check packaging and single-pass helper (no models)
        run: |
          bash -n scripts/install.sh
          python3 tests/test_install.py
          python3 tests/test_check.py
          python3 tests/test_kit_format.py
      - name: Package and test the distribution
        run: |
          tar -czf readme-loop.tar.gz SKILL.md README.md references scripts tests
          mkdir unpacked
          tar -xzf readme-loop.tar.gz -C unpacked
          python3 unpacked/tests/test_install.py
          python3 unpacked/tests/test_check.py
          python3 unpacked/tests/test_kit_format.py
      - uses: actions/upload-artifact@v4
        with:
          name: readme-loop-${{ matrix.os }}
          path: readme-loop.tar.gz
